services:
  backend:
    build:
      context: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Containers can't use Windows auth: use a SQL login. Set DB_CONNECTION_STRING in .env (see .env.example).
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING:?Set DB_CONNECTION_STRING in .env}
      App__FrontendBaseUrl: ${FRONTEND_BASE_URL:-http://localhost:8080}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-no-reply@redstarvibe.local}
      Email__Smtp__Host: ${SMTP_HOST:?Set SMTP_HOST in .env}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__Username: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__Smtp__UseStartTls: ${SMTP_USE_STARTTLS:-true}
      Sms__Twilio__AccountSid: ${TWILIO_ACCOUNT_SID:?Set TWILIO_ACCOUNT_SID in .env}
      Sms__Twilio__AuthToken: ${TWILIO_AUTH_TOKEN:?Set TWILIO_AUTH_TOKEN in .env}
      Sms__Twilio__FromNumber: ${TWILIO_FROM_NUMBER:-}
      Sms__Twilio__MessagingServiceSid: ${TWILIO_MESSAGING_SERVICE_SID:-}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/red-star-vibe-app
    environment:
      API_UPSTREAM: http://backend:8080
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
